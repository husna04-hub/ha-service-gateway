version: 1

listen:
  host: 0.0.0.0
  port: 8080

request:
  timeout_seconds: 2.0
  max_attempts: 3
  retry_on_status: [502, 503, 504]
  max_body_bytes: 10485760
  max_response_bytes: 10485760

health:
  path: /healthz
  interval_seconds: 2.0
  timeout_seconds: 0.8
  failure_threshold: 3
  success_threshold: 2
  initial_state: healthy

backends:
  - name: api-1
    url: http://127.0.0.1:9001
    weight: 1
  - name: api-2
    url: http://127.0.0.1:9002
    weight: 1
  - name: api-3
    url: http://127.0.0.1:9003
    weight: 1

metrics:
  enabled: true
  path: /metrics

logging:
  level: INFO
  format: json

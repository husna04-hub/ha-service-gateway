services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config/docker.yaml:/etc/ha-gateway/config.yaml:ro
    depends_on:
      - backend-a
      - backend-b
      - backend-c
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3
    restart: unless-stopped

  backend-a:
    build: .
    command:
      - python
      - -m
      - ha_gateway.demo_backend
      - --name
      - backend-a
      - --port
      - "9001"
    restart: unless-stopped

  backend-b:
    build: .
    command:
      - python
      - -m
      - ha_gateway.demo_backend
      - --name
      - backend-b
      - --port
      - "9001"
    restart: unless-stopped

  backend-c:
    build: .
    command:
      - python
      - -m
      - ha_gateway.demo_backend
      - --name
      - backend-c
      - --port
      - "9001"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway
    restart: unless-stopped

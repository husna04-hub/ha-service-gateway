version: 1

listen:
  host: 0.0.0.0
  port: 8080

request:
  timeout_seconds: 1.0
  max_attempts: 3
  retry_on_status: [502, 503, 504]

health:
  path: /healthz
  interval_seconds: 0.5
  timeout_seconds: 0.3
  failure_threshold: 2
  success_threshold: 2
  initial_state: healthy

backends:
  - name: backend-a
    url: http://backend-a:9001
    weight: 1
  - name: backend-b
    url: http://backend-b:9001
    weight: 1
  - name: backend-c
    url: http://backend-c:9001
    weight: 1

metrics:
  enabled: true
  path: /metrics

logging:
  level: INFO
  format: json
